<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EX Workbench</title>
<style>
:root{
  --bg:#0c0d0f; --panel:#17191c; --panel-2:#202328; --ink:#ececee; --muted:#8d929b; --line:#2f333a;
  --accent:#f0904a; --accent-ink:#1b1206; --lcd-fg:#9cf0b8; --lcd-dim:#3f8a5c; --ok:#57d08a; --warn:#f0a43a; --bad:#ff5a4e;
  --card:#1c1e22; --well:#131417; --track:#363a42;
  --face:linear-gradient(180deg,#1f2226 0%,#191b1f 60%,#16181b 100%);
  --f-display:"Chakra Petch","Avenir Next Condensed","Arial Narrow",sans-serif;
  --f-body:-apple-system,"Helvetica Neue","IBM Plex Sans",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,"IBM Plex Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1b1d21,transparent),var(--bg);color:var(--ink);font:13px/1.4 var(--f-body);user-select:none;-webkit-user-select:none;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:#25282d;border:1px solid #353941;border-radius:7px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,.kn:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:10px 12px}
.face{background:var(--face);border:1px solid #2b2e34;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.35)}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;position:relative}
header::before,header::after{content:"";position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6b7078,#2a2d32 70%)}
header::before{left:6px} header::after{right:6px}
.brand{font:600 18px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--accent);font-weight:600}
.bankname{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.grow{flex:1}
.meter{display:flex;align-items:center;gap:8px;font:600 10px var(--f-mono);color:var(--muted);letter-spacing:.08em}
.bar{width:90px;height:6px;border-radius:3px;background:#0b0c0e;box-shadow:inset 0 0 0 1px #2b2e34;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#57d08a,#f0c04a 70%,#ff5a4e);background-size:90px 100%;transition:width .15s}
main{display:grid;grid-template-columns:minmax(220px,290px) minmax(0,1fr);gap:10px;min-height:0}
.browser{display:grid;grid-template-rows:auto auto auto 1fr;gap:8px;padding:10px;min-height:0}
.search{width:100%;background:#121316;border:1px solid #353941;border-radius:7px;padding:6px 9px;user-select:text}
.cats{display:flex;flex-wrap:wrap;gap:4px}
.cat{font-size:11px;padding:3px 8px;border-radius:999px}
.cat span{opacity:.55;font-size:10px}
.cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{overflow:auto;background:#121316;border:1px solid #2b2e34;border-radius:8px;min-height:0}
.row{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:7px;align-items:center;padding:5px 8px;border-bottom:1px solid #22252a;cursor:pointer}
.row:hover{background:#1c1f23}
.row[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.row .pc{font:500 10px var(--f-mono);opacity:.55}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{background:none;border:0;padding:0 2px;font-size:14px;opacity:.5;line-height:1}
.fav[aria-pressed="true"]{opacity:1;color:var(--warn)}
.row[aria-current="true"] .fav{color:var(--accent-ink)}
.empty{padding:14px;color:var(--muted);line-height:1.5}
.right{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:min-content;gap:10px;overflow:auto;min-height:0;padding-right:2px}
.span2{grid-column:1/-1}
.lcdrow{display:flex;gap:10px;align-items:stretch}
.lcd{flex:1;min-width:0;border-radius:10px;padding:12px 16px;background:radial-gradient(120% 140% at 30% 0%,#123426,#0a1a13 70%);color:var(--lcd-fg);box-shadow:inset 0 0 0 1px #000,inset 0 2px 10px rgba(0,0,0,.6),0 0 0 3px #101114;text-shadow:0 0 6px rgba(156,240,184,.35);font-family:var(--f-mono)}
.lcd .l1{font:600 20px/1.2 var(--f-mono);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.lcd .l2{font-size:11px;display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:5px}
.lcd .l2 b{color:var(--lcd-dim);font-weight:500;margin-right:4px}
.mastercell{display:grid;place-items:center;padding:8px 14px}
.card{padding:12px 14px;display:grid;gap:10px;align-content:start}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd h2{margin:0;font:600 13px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase}
.hd h2::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:9px;vertical-align:2px;box-shadow:0 0 6px var(--accent)}
.hd .sub{font:500 11px var(--f-mono);color:var(--muted)}
.hd .grow{flex:1}
.lbtn{font:600 10px/1 var(--f-mono);padding:5px 7px;border-radius:5px;color:var(--muted)}
.lbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px 6px}
.kcell{display:grid;justify-items:center;gap:3px;text-align:center;min-width:0}
.kcell .kl{font:500 10px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcell output{font:500 11px/1 var(--f-mono);color:var(--ink);min-height:12px;white-space:nowrap}
.learn{font:500 9px/1.2 var(--f-mono);padding:1px 5px;border-radius:4px;border:1px solid transparent;background:none;color:var(--muted)}
.learn:hover{border-color:#353941}
.learn.custom{color:var(--accent)}
.learn.on{background:var(--accent);color:var(--accent-ink);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.kn{width:50px;height:50px;cursor:ns-resize;touch-action:none;border-radius:50%;outline:none}
.kn svg{width:100%;height:100%;display:block;overflow:visible}
.kn .kb{fill:url(#kn-grad);stroke:#0a0b0c;stroke-width:1}
.kn .kr{fill:none;stroke:#2c2f35;stroke-width:3.2;stroke-linecap:round}
.kn .ka{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;filter:drop-shadow(0 0 2px rgba(240,144,74,.6))}
.kn .kp{stroke:#f4f1ea;stroke-width:2.4;stroke-linecap:round}
.kn.big{width:62px;height:62px}
.dim{opacity:.38}
.seg{display:flex;gap:3px;background:var(--card);border:1px solid #363a42;border-radius:8px;padding:3px;min-width:0}
.seg button{flex:1 1 0;background:none;border:0;border-radius:6px;color:var(--muted);padding:4px 6px;font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.srow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center}
.srow > span{font-size:12px;color:var(--ink)}
.status{font-size:12px;color:var(--muted)}
.prog{height:4px;border-radius:2px;background:#0b0c0e;overflow:hidden;width:180px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.kbd{height:74px;padding:8px 10px}
.keys-in{position:relative;display:flex;height:100%}
.key{position:relative;flex:1;background:linear-gradient(180deg,#d9d5cc,#f1eee7 12%,#ebe7df);border:1px solid #26282c;border-radius:0 0 5px 5px;margin-right:-1px;cursor:pointer}
.key.black{position:absolute;top:0;height:60%;background:linear-gradient(180deg,#0e0f11,#24262a 85%,#2e3035);border-color:#08090a;z-index:2;border-radius:0 0 4px 4px}
.key.on{background:var(--accent)!important}
.welcome{grid-column:1/-1;padding:28px;display:grid;gap:12px;justify-items:start;max-width:620px}
.welcome h1{margin:0;font:600 18px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.welcome p{margin:0;color:var(--muted);line-height:1.6}
@media (max-width:900px){.right{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="kn-grad" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#4a4e56"/><stop offset=".55" stop-color="#26292e"/><stop offset="1" stop-color="#16181b"/></radialGradient></defs></svg>
<div class="app">
  <header class="face">
    <div class="brand"><b>E</b>X Workbench</div>
    <span class="bankname" id="bankname">no bank loaded</span>
    <button type="button" class="primary" id="btn-load">Load bank…</button>
    <button type="button" id="btn-recent" hidden></button>
    <span class="status" id="status"></span>
    <span class="prog" id="prog" hidden><i id="prog-i"></i></span>
    <span class="grow"></span>
    <span class="meter">NOTES <span class="bar"><i id="notes-bar"></i></span><span id="notes-v">0</span></span>
  </header>
  <main>
    <section class="face browser" aria-label="Presets">
      <input class="search" id="search" type="search" placeholder="Filter presets" aria-label="Filter presets">
      <div class="cats" id="cats"></div>
      <div class="cats"><button type="button" class="cat" id="prev" aria-label="Previous preset">‹ prev</button><button type="button" class="cat" id="next" aria-label="Next preset">next ›</button></div>
      <div class="list" id="list" role="listbox" aria-label="Presets"><div class="empty">Load an Emulator X bank (.exb). Its SamplePool folder must sit next to it, as it does on the X3 disk.</div></div>
    </section>
    <div class="right" id="right">
      <div class="lcdrow span2">
        <div class="lcd"><div class="l1" id="lcd1">EX WORKBENCH</div><div class="l2" id="lcd2"><span>LOAD A BANK TO START</span></div></div>
        <div class="face mastercell"><div class="kcell" id="k-master"></div></div>
      </div>
      <section class="face card span2">
        <div class="hd"><h2>Controllers</h2><span class="sub" id="ctl-sub"></span><span class="grow"></span><button type="button" class="lbtn" id="btn-defcc" title="Forget MIDI-learned knobs and use X3's default CC numbers">DEFAULT CCS</button></div>
        <div class="kgrid" id="ctl"></div>
      </section>
      <section class="face card">
        <div class="hd"><h2>Performance</h2></div>
        <div class="srow"><span>Keys</span><div class="seg" data-param="keys" data-opts="Preset,Poly,Mono,Legato"></div></div>
        <div class="srow"><span>Glide</span><div class="seg" data-param="glideMode" data-opts="Preset,Off,Custom"></div></div>
        <div class="srow"><span>Bend</span><div class="seg" data-param="bendOwn" data-opts="Fixed range,Preset's own" data-vals="0,1"></div></div>
        <div class="kgrid" id="perf-knobs"></div>
      </section>
      <section class="face card">
        <div class="hd"><h2>Unison</h2><span class="grow"></span></div>
        <div class="srow"><span>Unison</span><div class="seg" data-param="uniOn" data-opts="Off,On" data-vals="0,1"></div></div>
        <div class="srow"><span>Voices</span><div class="seg" data-param="uniVoices" data-opts="2,3,4,5,6,7,8" data-vals="2,3,4,5,6,7,8"></div></div>
        <div class="kgrid" id="uni-knobs"></div>
      </section>
      <section class="face card span2">
        <div class="hd"><h2>Analog</h2><span class="sub">warmth, weight and sub on the whole output</span><span class="grow"></span><button type="button" class="lbtn" data-toggle="colMono" title="Below 120 Hz both sides play as one">MONO BASS</button><button type="button" class="lbtn" data-toggle="colOn">ON</button></div>
        <div class="kgrid" id="col-knobs"></div>
      </section>
    </div>
  </main>
  <div class="face kbd" id="kbd" aria-label="Keyboard"></div>
</div>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const backend = window.__JUCE__ && window.__JUCE__.backend;
const send = o => { try { backend && backend.emitEvent('exw', o); } catch (e) {} };
const AP = 'ABCDEFGHIJKLMNOP', AP_CC = [21, 22, 23, 24, 25, 26, 27, 28, 70, 71, 72, 73, 91, 93, 82, 83];
const KB = ['Poly', 'Multiple trigger', 'Melody (last)', 'Melody (low)', 'Melody (high)', 'Synth (last)', 'Synth (low)', 'Synth (high)', 'Fingered glide'];
const CAT_NAMES = { syn: 'Synth', bas: 'Bass', led: 'Lead', pad: 'Pad', arp: 'Arp', bts: 'Beats', bpm: 'BPM', raw: 'Raw', edg: 'Edg', wal: 'Wal', air: 'Air', kit: 'Kits', nse: 'Noise', hit: 'Hits', sfx: 'SFX', vox: 'Vox', prc: 'Perc', bel: 'Bells', key: 'Keys' };
const st = { presets: [], preset: -1, info: null, params: {}, apcc: AP_CC.slice(), favs: new Set(), knobs: Array(16).fill(0), cat: 'all', filter: '', learn: -1, bank: null };
const catOf = n => (String(n).match(/^([a-z0-9]{2,4}):/i) || [, ''])[1].toLowerCase();

/* ---------- knobs ---------- */
const A0 = -135, A1 = 135, RR = 20;
const pt = (a, r = RR) => [25 + r * Math.sin(a * Math.PI / 180), 25 - r * Math.cos(a * Math.PI / 180)];
const arc = (a, b) => { if (Math.abs(b - a) < .01) return ''; const [x0, y0] = pt(a), [x1, y1] = pt(b); return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${RR} ${RR} 0 ${Math.abs(b - a) > 180 ? 1 : 0} ${b > a ? 1 : 0} ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
function knob(host, o) { // o: {label, min, max, step, value, def, fmt, onChange, big}
  host.innerHTML = `<span class="kl">${esc(o.label)}</span>${o.extra || ''}<div class="kn${o.big ? ' big' : ''}" tabindex="0" role="slider" aria-label="${esc(o.label)}"><svg viewBox="0 0 50 50"><path class="kr" d="${arc(A0, A1)}"/><path class="ka"/><circle class="kb" cx="25" cy="25" r="15"/><line class="kp" x1="25" y1="25" x2="25" y2="13"/></svg></div><output></output>`;
  const kn = host.querySelector('.kn'), ka = kn.querySelector('.ka'), kp = kn.querySelector('.kp'), out = host.querySelector('output');
  let v = o.value;
  const draw = () => {
    const f = (v - o.min) / (o.max - o.min), a = A0 + Math.max(0, Math.min(1, f)) * (A1 - A0), z = o.min < 0 && o.max > 0 ? A0 + (-o.min / (o.max - o.min)) * (A1 - A0) : A0;
    ka.setAttribute('d', a >= z ? arc(z, a) : arc(a, z)); const [x, y] = pt(a, 11); kp.setAttribute('x2', x.toFixed(2)); kp.setAttribute('y2', y.toFixed(2));
    out.textContent = o.fmt ? o.fmt(v) : String(Math.round(v)); kn.setAttribute('aria-valuenow', String(v)); kn.setAttribute('aria-valuetext', out.textContent);
  };
  const set = (nv, user) => { nv = Math.max(o.min, Math.min(o.max, Math.round(nv / o.step) * o.step)); if (nv === v) return; v = nv; draw(); if (user) o.onChange(v); };
  let drag = null;
  kn.addEventListener('pointerdown', e => { e.preventDefault(); kn.focus(); kn.setPointerCapture(e.pointerId); drag = { y: e.clientY, x: e.clientX, v }; });
  kn.addEventListener('pointermove', e => { if (!drag) return; const d = (drag.y - e.clientY) + (e.clientX - drag.x) * .5; set(drag.v + d / 180 * (o.max - o.min) * (e.shiftKey ? .15 : 1), true); });
  const end = () => { drag = null; }; kn.addEventListener('pointerup', end); kn.addEventListener('pointercancel', end);
  kn.addEventListener('wheel', e => { e.preventDefault(); set(v - Math.sign(e.deltaY) * Math.max(o.step, (o.max - o.min) / (e.shiftKey ? 400 : 100)), true); }, { passive: false });
  kn.addEventListener('dblclick', () => set(o.def ?? (o.min < 0 && o.max > 0 ? 0 : o.min), true));
  kn.addEventListener('keydown', e => { const d = Math.max(o.step, (o.max - o.min) / 100), m = { ArrowUp: d, ArrowRight: d, ArrowDown: -d, ArrowLeft: -d, PageUp: 10 * d, PageDown: -10 * d }[e.key]; if (m !== undefined) { e.preventDefault(); set(v + m, true); } });
  draw();
  return { set: x => { if (!drag) { v = x; draw(); } }, el: host, kn };
}
// parameter knobs
const PK = {};
function paramKnob(boxSel, id, label, min, max, step, fmt, extra) {
  const cell = document.createElement('div'); cell.className = 'kcell'; $(boxSel).appendChild(cell);
  PK[id] = knob(cell, { label, min, max, step, value: st.params[id] ?? min, fmt, onChange: v => { st.params[id] = v; send({ type: 'param', id, value: v }); renderDim(); }, ...extra });
}
paramKnob('#perf-knobs', 'glideMs', 'Glide time', 5, 2000, 1, v => Math.round(v) + ' ms');
paramKnob('#perf-knobs', 'bendRange', 'Bend range', 0, 24, 1, v => v ? '±' + v + ' st' : 'off');
paramKnob('#uni-knobs', 'uniDetune', 'Detune', 0, 100, 1, v => '±' + Math.round(v) + ' ct');
paramKnob('#uni-knobs', 'uniSpread', 'Spread', 0, 100, 1, v => Math.round(v) + '%');
paramKnob('#uni-knobs', 'uniBlend', 'Blend', 0, 100, 1, v => Math.round(v) + '%');
paramKnob('#uni-knobs', 'uniDrift', 'Drift', 0, 100, 1, v => v ? Math.round(v) + '%' : 'off');
paramKnob('#col-knobs', 'colWarmth', 'Warmth', 0, 100, 1, v => Math.round(v) + '%');
paramKnob('#col-knobs', 'colWeight', 'Weight', 0, 100, 1, v => '+' + (v / 100 * 6).toFixed(1) + ' dB');
paramKnob('#col-knobs', 'colSub', 'Sub', 0, 100, 1, v => Math.round(v) + '%');
paramKnob('#col-knobs', 'colSmooth', 'Smooth', 0, 100, 1, v => v < 1 ? 'off' : (22000 * Math.pow(6500 / 22000, v / 100) / 1000).toFixed(1) + ' k');
PK.master = knob($('#k-master'), { label: 'Master', min: -60, max: 6, step: .1, value: 0, def: 0, big: true, fmt: v => v <= -59.9 ? '−∞' : (v > 0 ? '+' : '') + v.toFixed(1) + ' dB', onChange: v => { st.params.master = v; send({ type: 'param', id: 'master', value: v }); } });

// segmented parameter controls
document.querySelectorAll('.seg[data-param]').forEach(sg => {
  const opts = sg.dataset.opts.split(','), vals = (sg.dataset.vals || opts.map((_, i) => i).join(',')).split(',').map(Number);
  sg.setAttribute('role', 'radiogroup');
  sg.innerHTML = opts.map((o, i) => `<button type="button" role="radio" data-v="${vals[i]}">${esc(o)}</button>`).join('');
  sg.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; const id = sg.dataset.param, v = +b.dataset.v; st.params[id] = v; send({ type: 'param', id, value: v }); renderParams(); });
});
document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.toggle, v = st.params[id] > .5 ? 0 : 1; st.params[id] = v; send({ type: 'param', id, value: v }); renderParams(); }));
function renderDim() {
  PK.glideMs.kn.classList.toggle('dim', st.params.glideMode !== 2); PK.bendRange.kn.classList.toggle('dim', st.params.bendOwn > .5);
  ['uniDetune', 'uniSpread', 'uniBlend', 'uniDrift'].forEach(k => PK[k].kn.classList.toggle('dim', !(st.params.uniOn > .5)));
  ['colWarmth', 'colWeight', 'colSub', 'colSmooth'].forEach(k => PK[k].kn.classList.toggle('dim', !(st.params.colOn > .5)));
}
function renderParams() {
  for (const [id, k] of Object.entries(PK)) if (st.params[id] !== undefined) k.set(st.params[id]);
  document.querySelectorAll('.seg[data-param]').forEach(sg => { const v = Math.round(st.params[sg.dataset.param] ?? -1); sg.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-checked', String(+b.dataset.v === v))); });
  document.querySelectorAll('[data-toggle]').forEach(b => b.classList.toggle('on', st.params[b.dataset.toggle] > .5));
  renderDim();
}

/* ---------- controllers (MIDI A-P) ---------- */
const CK = [];
function renderControllers() {
  const box = $('#ctl'), info = st.info; box.innerHTML = ''; CK.length = 0;
  if (!info) { box.innerHTML = '<div class="empty">Pick a preset to see its knobs.</div>'; return; }
  for (let i = 0; i < 16; i++) {
    const nm = info.labels[i] && info.labels[i] !== '-' ? info.labels[i] : '';
    if (!nm && !info.used[i]) continue;
    const cc = st.apcc[i], custom = cc !== AP_CC[i];
    const cell = document.createElement('div'); cell.className = 'kcell'; box.appendChild(cell);
    const tag = `<button type="button" class="learn${st.learn === i ? ' on' : ''}${custom ? ' custom' : ''}" data-learn="${i}" title="MIDI learn: click, then move a knob on your keyboard">${st.learn === i ? 'move a knob…' : AP[i] + ' · ' + (cc < 0 ? 'off' : 'CC' + cc)}</button>`;
    CK[i] = knob(cell, { label: nm || 'MIDI ' + AP[i], extra: tag, min: 0, max: 127, step: 1, value: Math.round(st.knobs[i] * 127), def: info.ic[i], fmt: v => String(Math.round(v)), onChange: v => { st.knobs[i] = v / 127; send({ type: 'param', id: 'ctl' + AP[i], value: v }); } });
  }
  $('#ctl-sub').textContent = info ? 'double-click a knob for the preset’s starting position' : '';
}
$('#ctl').addEventListener('click', e => { const b = e.target.closest('[data-learn]'); if (!b) return; const i = +b.dataset.learn; st.learn = st.learn === i ? -1 : i; send({ type: 'learn', index: st.learn }); renderControllers(); });
$('#btn-defcc').addEventListener('click', () => send({ type: 'defcc' }));

/* ---------- preset browser ---------- */
const pcOf = i => `${i >= 128 ? Math.floor(i / 128) + ':' : ''}${String(i % 128 + 1).padStart(3, '0')}`;
function rows() { const f = st.filter.toLowerCase(); return st.presets.map((n, i) => [n, i]).filter(([n]) => n.toLowerCase().includes(f) && (st.cat === 'all' || (st.cat === 'fav' ? st.favs.has(n) : catOf(n) === st.cat))); }
function renderCats() {
  const counts = {}; st.presets.forEach(n => { const c = catOf(n); if (c) counts[c] = (counts[c] || 0) + 1; });
  const b = (k, l, n) => `<button type="button" class="cat" data-cat="${k}" aria-pressed="${st.cat === k}">${esc(l)} <span>${n}</span></button>`;
  $('#cats').innerHTML = st.presets.length ? b('all', 'All', st.presets.length) + b('fav', '★', st.presets.filter(n => st.favs.has(n)).length) + Object.keys(counts).sort((a, c) => counts[c] - counts[a]).map(k => b(k, CAT_NAMES[k] || k.toUpperCase(), counts[k])).join('') : '';
}
function renderList() {
  renderCats();
  const el = $('#list');
  if (!st.presets.length) { el.innerHTML = `<div class="empty">${st.bank ? 'No presets in this bank.' : 'Load an Emulator X bank (.exb). Its <b>SamplePool</b> folder must sit next to it, as it does on the X3 disk.'}</div>`; return; }
  const rs = rows();
  el.innerHTML = rs.map(([n, i]) => `<div class="row" role="option" tabindex="0" data-i="${i}" aria-current="${i === st.preset}"><button type="button" class="fav" data-fav="${esc(n)}" aria-pressed="${st.favs.has(n)}" aria-label="Favourite">${st.favs.has(n) ? '★' : '☆'}</button><span class="pc">${pcOf(i)}</span><span class="nm">${esc(n)}</span></div>`).join('') || '<div class="empty">Nothing matches.</div>';
  el.querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest' });
}
$('#list').addEventListener('click', e => { const f = e.target.closest('[data-fav]'); if (f) { e.stopPropagation(); send({ type: 'fav', name: f.dataset.fav }); return; } const r = e.target.closest('[data-i]'); if (r) pick(+r.dataset.i); });
$('#list').addEventListener('keydown', e => { const r = e.target.closest('.row'); if (!r) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(+r.dataset.i); } if (e.key === 'ArrowDown') { e.preventDefault(); r.nextElementSibling?.focus(); } if (e.key === 'ArrowUp') { e.preventDefault(); r.previousElementSibling?.focus(); } });
$('#cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) { st.cat = b.dataset.cat; renderList(); $('#list').scrollTop = 0; } });
$('#search').addEventListener('input', e => { st.filter = e.target.value; renderList(); });
const step = d => { const rs = rows(); if (!rs.length) return; const at = rs.findIndex(([, i]) => i === st.preset); pick(rs[(at < 0 ? (d > 0 ? 0 : rs.length - 1) : (at + d + rs.length) % rs.length)][1]); };
$('#prev').addEventListener('click', () => step(-1)); $('#next').addEventListener('click', () => step(1));
function pick(i) { st.preset = i; send({ type: 'preset', index: i }); renderList(); }

function renderLcd() {
  const info = st.info;
  $('#lcd1').textContent = info ? info.name : st.bank ? 'PICK A PRESET' : 'EX WORKBENCH';
  if (!info) { $('#lcd2').innerHTML = `<span>${st.bank ? esc(st.bank) : 'LOAD A BANK TO START'}</span>`; return; }
  const parts = [['PROG', pcOf(info.index)], ['VOICES', info.voices], ['ZONES', info.zones], ['KEYS', info.kb ? KB[info.kb] : 'Poly']];
  if (info.glide > 0) parts.push(['GLIDE', Math.round(info.glide * 1000) + ' ms/oct']);
  if (info.bend >= 0) parts.push(['BEND', info.bend ? '±' + info.bend : 'by cord']);
  $('#lcd2').innerHTML = parts.map(([k, v]) => `<span><b>${k}</b>${esc(String(v).toUpperCase())}</span>`).join('');
}

/* ---------- keyboard ---------- */
(function keys() {
  const box = $('#kbd'), lo = 48, hi = 84, white = [], isB = n => [1, 3, 6, 8, 10].includes(n % 12);
  for (let n = lo; n <= hi; n++) if (!isB(n)) white.push(n);
  box.innerHTML = '<div class="keys-in"></div>'; const el = box.firstChild;
  el.innerHTML = white.map(n => `<div class="key" data-n="${n}"></div>`).join('');
  const w = 100 / white.length;
  for (let n = lo; n <= hi; n++) if (isB(n)) { const k = document.createElement('div'); k.className = 'key black'; k.dataset.n = n; const idx = white.indexOf(n - 1); k.style.left = ((idx + 1) * w - w * .31) + '%'; k.style.width = (w * .62) + '%'; el.appendChild(k); }
  let down = null;
  const on = n => { down = n; el.querySelector(`[data-n="${n}"]`)?.classList.add('on'); send({ type: 'note', note: n, vel: 100 }); };
  const off = () => { if (down === null) return; el.querySelector(`[data-n="${down}"]`)?.classList.remove('on'); send({ type: 'note', note: down, vel: 0 }); down = null; };
  el.addEventListener('pointerdown', e => { const k = e.target.closest('[data-n]'); if (!k) return; el.setPointerCapture(e.pointerId); on(+k.dataset.n); });
  el.addEventListener('pointermove', e => { if (down === null) return; const k = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-n]'); if (k && +k.dataset.n !== down) { off(); on(+k.dataset.n); } });
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off);
})();

/* ---------- messages from the plugin ---------- */
$('#btn-load').addEventListener('click', () => send({ type: 'loadBank' }));
$('#btn-recent').addEventListener('click', () => send({ type: 'loadRecent' }));
function onMsg(m) {
  if (!m || !m.type) return;
  if (m.type === 'state') {
    if (m.presets) st.presets = m.presets;
    st.bank = m.bank || null; st.preset = m.preset; st.info = m.info || null; st.params = { ...st.params, ...(m.params || {}) }; st.apcc = m.apcc || st.apcc; st.favs = new Set(m.favs || []);
    st.learn = -1;
    if (m.knobs) st.knobs = m.knobs.slice();
    $('#bankname').textContent = st.bank || 'no bank loaded';
    $('#btn-recent').hidden = !m.recent || m.recent === st.bank; $('#btn-recent').textContent = 'Reload ' + (m.recent || '');
    $('#status').textContent = m.missing ? `${m.missing} zones have no sample` : (m.loading ? m.status : '');
    renderList(); renderLcd(); renderParams(); renderControllers();
  } else if (m.type === 'status') {
    $('#notes-bar').style.width = Math.min(100, m.notes / 40 * 100) + '%'; $('#notes-v').textContent = m.players > m.notes ? `${m.notes}·${m.players}` : String(m.notes);
    $('#prog').hidden = !m.loading; $('#prog-i').style.width = Math.round((m.progress || 0) * 100) + '%';
    if (m.loading) $('#status').textContent = m.status; else if (/^(Couldn|No |Found|Not an|Bank not)/.test(m.status || '')) $('#status').textContent = m.status;
    if (m.knobs) { st.knobs = m.knobs; CK.forEach((k, i) => k && k.set(Math.round(m.knobs[i] * 127))); }
    if (m.params) { Object.assign(st.params, m.params); renderParams(); }
  }
}
if (backend) { backend.addEventListener('exw', onMsg); send({ type: 'ready' }); }
else { $('#status').textContent = 'Preview: open inside the plugin to load banks.'; renderParams(); renderControllers(); }
window.__exwTest = onMsg;
})();
</script>
</body>
